<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ベビー着画メーカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .radio-group label {
      @apply border-2 border-gray-200 rounded-xl px-4 py-3 text-center cursor-pointer transition text-sm font-medium text-gray-700 bg-white hover:bg-gray-50;
    }
    .radio-group input[type="radio"]:checked + label {
      @apply border-indigo-500 bg-indigo-50 text-indigo-700 font-bold;
    }
    .disabled-section {
      @apply opacity-40 pointer-events-none transition;
    }
  </style>
</head>
<body class="bg-indigo-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-lg my-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold text-indigo-900 mb-2">&#x1f476; ベビー着画メーカー</h1>
      <p class="text-sm text-gray-500">置き画からベビーコーデ画像を生成します(プロトタイプ版)</p>
    </div>

    <!-- 1. コーディネートのアイテム登録 -->
    <div class="mb-8">
      <label class="block text-sm font-bold text-gray-800 mb-2">&#x2460; コーディネートのアイテムを登録</label>
      <p class="text-xs text-gray-500 mb-4">1点以上を登録してください。登録した順に「ウェア→雑貨→帽子」の順で重ねて合成します。</p>

      <div class="space-y-4">
        <!-- ウェア -->
        <div class="border-2 border-gray-100 rounded-2xl p-4">
          <p class="text-xs font-bold text-gray-700 mb-2">&#x1F455; ウェア（任意）</p>
          <div id="slotWear" class="upload-slot border-2 border-dashed border-indigo-300 rounded-xl p-4 text-center hover:bg-indigo-50 transition cursor-pointer flex items-center justify-center gap-3 bg-gray-50">
            <img id="previewWear" class="hidden h-16 w-16 rounded-lg object-contain border border-gray-200 bg-white" alt="ウェアのプレビュー">
            <span id="labelWear" class="text-sm text-gray-500">クリックして画像を選択</span>
            <input type="file" id="inputWear" accept="image/*" class="hidden" />
            <button type="button" id="clearWear" class="hidden ml-auto text-xs text-red-500 font-bold px-2 py-1">削除</button>
          </div>
        </div>

        <!-- 雑貨 -->
        <div class="border-2 border-gray-100 rounded-2xl p-4">
          <p class="text-xs font-bold text-gray-700 mb-2">&#x1f3a9; 雑貨（スタイなど・任意）</p>
          <div id="slotZakka" class="upload-slot border-2 border-dashed border-indigo-300 rounded-xl p-4 text-center hover:bg-indigo-50 transition cursor-pointer flex items-center justify-center gap-3 bg-gray-50">
            <img id="previewZakka" class="hidden h-16 w-16 rounded-lg object-contain border border-gray-200 bg-white" alt="雑貨のプレビュー">
            <span id="labelZakka" class="text-sm text-gray-500">クリックして画像を選択</span>
            <input type="file" id="inputZakka" accept="image/*" class="hidden" />
            <button type="button" id="clearZakka" class="hidden ml-auto text-xs text-red-500 font-bold px-2 py-1">削除</button>
          </div>
        </div>

        <!-- 帽子（新規） -->
        <div class="border-2 border-gray-100 rounded-2xl p-4">
          <p class="text-xs font-bold text-gray-700 mb-2">&#x1F3A9;&#x2757; ベビー帽子（任意・NEW）</p>
          <div id="slotHat" class="upload-slot border-2 border-dashed border-indigo-300 rounded-xl p-4 text-center hover:bg-indigo-50 transition cursor-pointer flex items-center justify-center gap-3 bg-gray-50">
            <img id="previewHat" class="hidden h-16 w-16 rounded-lg object-contain border border-gray-200 bg-white" alt="帽子のプレビュー">
            <span id="labelHat" class="text-sm text-gray-500">クリックして画像を選択</span>
            <input type="file" id="inputHat" accept="image/*" class="hidden" />
            <button type="button" id="clearHat" class="hidden ml-auto text-xs text-red-500 font-bold px-2 py-1">削除</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 服の詳細指定（ウェア登録時のみ有効） -->
    <div id="clothesDetailSection" class="mb-8 disabled-section">
      <label class="block text-sm font-bold text-gray-800 mb-3">&#x2461; 丈感（ウェア登録時のみ）</label>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-600 mb-1">袖の長さ</label>
          <select id="sleeveLength" class="w-full rounded-xl border-2 border-gray-200 p-3 text-sm focus:border-indigo-500 focus:outline-none transition">
            <option value="">指定なし</option>
            <option value="sleeveless">ノースリーブ</option>
            <option value="short sleeves" selected>半袖</option>
            <option value="long sleeves">長袖</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">パンツの長さ</label>
          <select id="pantsLength" class="w-full rounded-xl border-2 border-gray-200 p-3 text-sm focus:border-indigo-500 focus:outline-none transition">
            <option value="">指定なし</option>
            <option value="short pants">半ズボン・短パン</option>
            <option value="long pants">長ズボン</option>
            <option value="no pants" selected>ズボンなし（足開き）</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 赤ちゃんの特徴選択 -->
    <div class="mb-8">
      <label class="block text-sm font-bold text-gray-800 mb-3">&#x2462; ベビーモデル選択</label>

      <div class="mb-4">
        <p class="text-xs text-gray-600 font-bold mb-2 ml-1">性別</p>
        <div class="flex gap-3 radio-group">
          <div class="flex-1">
            <input type="radio" name="gender" value="baby boy" id="boy" class="sr-only" checked>
            <label for="boy" class="block w-full">&#x1F466; 男の子</label>
          </div>
          <div class="flex-1">
            <input type="radio" name="gender" value="baby girl" id="girl" class="sr-only">
            <label for="girl" class="block w-full">&#x1F467; 女の子</label>
          </div>
        </div>
      </div>

      <div class="mb-4">
        <p class="text-xs text-gray-600 font-bold mb-2 ml-1">タイプ</p>
        <div class="grid grid-cols-3 gap-3 radio-group">
          <div>
            <input type="radio" name="race" value="Japanese" id="jp" class="sr-only" checked>
            <label for="jp" class="block w-full">日本人</label>
          </div>
          <div>
            <input type="radio" name="race" value="half-Caucasian, half-Japanese" id="half" class="sr-only">
            <label for="half" class="block w-full">ハーフ系</label>
          </div>
          <div>
            <input type="radio" name="race" value="Caucasian" id="ca" class="sr-only">
            <label for="ca" class="block w-full">欧米系</label>
          </div>
        </div>
      </div>

      <!-- ポーズ選択（ウェア登録時のみ有効） -->
      <div id="poseDetailSection">
        <p class="text-xs text-gray-600 font-bold mb-2 ml-1">ポーズ</p>
        <div class="grid grid-cols-2 gap-3 radio-group">
          <div>
            <input type="radio" name="pose" value="sitting_front" id="poseFront" class="sr-only" checked>
            <label for="poseFront" class="block w-full px-2">おすわり<br><span class="text-xs font-normal">(正面)</span></label>
          </div>
          <div>
            <input type="radio" name="pose" value="sitting_side" id="poseSide" class="sr-only">
            <label for="poseSide" class="block w-full px-2">おすわり<br><span class="text-xs font-normal">(斜め)</span></label>
          </div>
          <div>
            <input type="radio" name="pose" value="standing" id="poseStand" class="sr-only">
            <label for="poseStand" class="block w-full px-2">つかまり<br><span class="text-xs font-normal">立ち</span></label>
          </div>
          <div>
            <input type="radio" name="pose" value="lying" id="poseLying" class="sr-only">
            <label for="poseLying" class="block w-full px-2">ねんね<br><span class="text-xs font-normal">(真上から)</span></label>
          </div>
        </div>
      </div>
    </div>

    <button id="generateBtn" disabled class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 px-4 rounded-2xl hover:from-indigo-700 hover:to-purple-700 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
      &#x2728; モデルとコーデ画像を生成する
    </button>

    <!-- ローディング表示 -->
    <div id="loading" class="hidden mt-8 text-center bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
      <div class="relative w-16 h-16 mx-auto mb-4">
        <div class="absolute inset-0 border-4 border-indigo-200 rounded-full animate-ping opacity-25"></div>
        <div class="absolute inset-0 border-4 border-t-indigo-600 rounded-full animate-spin"></div>
      </div>
      <p id="loadingStatus" class="text-indigo-800 font-bold text-lg animate-pulse">AIが準備しています...</p>
      <p id="loadingSubStatus" class="text-sm text-indigo-600 mt-2">しばらくお待ちください</p>

      <!-- 進捗バー -->
      <div class="w-full bg-gray-200 rounded-full h-3 mt-6 overflow-hidden relative">
        <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full w-0 transition-all duration-700 ease-out"></div>
      </div>
    </div>

    <!-- エラー表示 -->
    <div id="errorBox" class="hidden mt-6 p-5 bg-red-50 text-red-700 rounded-2xl text-sm font-medium border border-red-200 text-center shadow-sm flex items-center justify-center gap-2">
      <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span id="errorMessage"></span>
    </div>

    <!-- 結果表示 -->
    <div id="resultContainer" class="hidden mt-10 text-center">
      <h2 class="text-xl font-extrabold text-gray-800 mb-6 flex items-center justify-center gap-2">
        <span class="text-2xl">&#x1F389;</span> 完成しました！
      </h2>

      <div class="bg-white p-2 rounded-3xl shadow-lg border-2 border-indigo-50 inline-block">
        <img id="resultImage" class="w-full max-w-md rounded-2xl" alt="生成された画像">
      </div>

      <button id="downloadBtn" class="mt-6 w-full sm:w-auto bg-green-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-green-600 transition shadow-md flex items-center justify-center gap-2 mx-auto disabled:opacity-50 disabled:cursor-not-allowed">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>画像を保存する</span>
      </button>
    </div>
  </div>

  <script>
    const generateBtn = document.getElementById('generateBtn');

    const loading = document.getElementById('loading');
    const loadingStatus = document.getElementById('loadingStatus');
    const loadingSubStatus = document.getElementById('loadingSubStatus');
    const progressBar = document.getElementById('progressBar');

    const resultContainer = document.getElementById('resultContainer');
    const resultImage = document.getElementById('resultImage');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const downloadBtn = document.getElementById('downloadBtn');

    const sleeveLength = document.getElementById('sleeveLength');
    const pantsLength = document.getElementById('pantsLength');
    const clothesDetailSection = document.getElementById('clothesDetailSection');
    const poseDetailSection = document.getElementById('poseDetailSection');

    // ---- アイテム3枠（ウェア／雑貨／帽子）の管理 ----
    // type: 'clothes'（ウェア） / 'bib'（雑貨・帽子共通の「平置きアイテム」扱い）
    const slots = {
      wear:  { dataUri: null, type: 'clothes', input: document.getElementById('inputWear'),  zone: document.getElementById('slotWear'),  preview: document.getElementById('previewWear'),  label: document.getElementById('labelWear'),  clearBtn: document.getElementById('clearWear') },
      zakka: { dataUri: null, type: 'bib',      input: document.getElementById('inputZakka'), zone: document.getElementById('slotZakka'), preview: document.getElementById('previewZakka'), label: document.getElementById('labelZakka'), clearBtn: document.getElementById('clearZakka') },
      hat:   { dataUri: null, type: 'hat',      input: document.getElementById('inputHat'),   zone: document.getElementById('slotHat'),   preview: document.getElementById('previewHat'),   label: document.getElementById('labelHat'),   clearBtn: document.getElementById('clearHat') }
    };

    const updateWearDependentSections = () => {
      const hasWear = !!slots.wear.dataUri;
      // 丈感（袖・パンツ）はウェア専用のためウェア登録時のみ有効
      clothesDetailSection.classList.toggle('disabled-section', !hasWear);
      // ポーズ（ねんね含む）はウェアの有無に関わらず常に選択可能
      poseDetailSection.classList.remove('disabled-section');
    };

    const updateGenerateButtonState = () => {
      const anyItem = slots.wear.dataUri || slots.zakka.dataUri || slots.hat.dataUri;
      generateBtn.disabled = !anyItem;
    };

    const setSlotImage = (key, dataUri) => {
      const s = slots[key];
      s.dataUri = dataUri;
      s.preview.src = dataUri;
      s.preview.classList.remove('hidden');
      s.label.classList.add('hidden');
      s.clearBtn.classList.remove('hidden');
      updateWearDependentSections();
      updateGenerateButtonState();
      hideError();
      resultContainer.classList.add('hidden');
    };

    const clearSlotImage = (key) => {
      const s = slots[key];
      s.dataUri = null;
      s.input.value = '';
      s.preview.classList.add('hidden');
      s.label.classList.remove('hidden');
      s.clearBtn.classList.add('hidden');
      updateWearDependentSections();
      updateGenerateButtonState();
    };

    Object.keys(slots).forEach((key) => {
      const s = slots[key];
      s.zone.addEventListener('click', (e) => {
        if (e.target === s.clearBtn) return;
        s.input.click();
      });
      s.input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith('image/')) {
          showError('画像ファイルを選択してください。');
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => setSlotImage(key, event.target.result);
        reader.readAsDataURL(file);
      });
      s.clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        clearSlotImage(key);
      });
      s.zone.addEventListener('dragover', (e) => { e.preventDefault(); s.zone.classList.add('border-indigo-500', 'bg-indigo-50'); });
      s.zone.addEventListener('dragleave', (e) => { e.preventDefault(); s.zone.classList.remove('border-indigo-500', 'bg-indigo-50'); });
      s.zone.addEventListener('drop', (e) => {
        e.preventDefault();
        s.zone.classList.remove('border-indigo-500', 'bg-indigo-50');
        const file = e.dataTransfer.files[0];
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (event) => setSlotImage(key, event.target.result);
        reader.readAsDataURL(file);
      });
    });

    downloadBtn.addEventListener('click', async () => {
      if (!resultImage.src) return;

      const originalText = downloadBtn.innerHTML;
      downloadBtn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>保存の準備中...</span>';
      downloadBtn.disabled = true;

      try {
        const response = await fetch(resultImage.src);
        if (!response.ok) throw new Error("Network response was not ok");
        const blob = await response.blob();

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;

        a.download = `tryon_baby_${new Date().getTime()}.jpg`;

        document.body.appendChild(a);
        a.click();

        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      } catch (error) {
        console.error("ダウンロードエラー:", error);
        alert("画像の保存に失敗しました。\nお手数ですが、画像を長押し（または右クリック）して保存してください。");
      } finally {
        downloadBtn.innerHTML = originalText;
        downloadBtn.disabled = false;
      }
    });

    // jobId が完了するまでポーリングし、完成画像（base64 data URI）を返す。
    // progressStart/progressEnd の範囲でプログレスバーを更新する。
    const waitForJob = (jobId, progressStart, progressEnd, stepLabel) => {
      return new Promise((resolve, reject) => {
        const poll = async () => {
          try {
            const res = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'status', jobId })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'ステータス確認に失敗しました');

            if (data.status === 'completed') {
              fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'delete', jobId })
              }).catch(e => console.error("削除リクエストエラー", e));

              updateProgress(progressEnd, stepLabel, "完成しました");
              resolve(data.output[0]);
            } else if (data.status === 'failed') {
              console.error(`[${stepLabel}] failed job payload:`, data);
              const rawMsg = data.error?.message || data.error?.name || JSON.stringify(data.error) || '不明なエラー';
              reject(new Error(`[${stepLabel}] ${rawMsg}`));
            } else {
              const current = parseInt(progressBar.style.width) || progressStart;
              const next = Math.min(current + Math.max(2, Math.round((progressEnd - progressStart) / 6)), progressEnd - 2);
              updateProgress(next, stepLabel, "高精度な処理のため、もう少しかかります");
              setTimeout(poll, 4000);
            }
          } catch (err) {
            reject(err);
          }
        };
        setTimeout(poll, 4000);
      });
    };

    const showError = (msg) => {
      errorMessage.textContent = msg;
      errorBox.classList.remove('hidden');
      loading.classList.add('hidden');
      generateBtn.disabled = false;
    }
    const hideError = () => {
      errorBox.classList.add('hidden');
    }

    const updateProgress = (percent, status, subStatus) => {
      progressBar.style.width = `${percent}%`;
      loadingStatus.textContent = status;
      if (subStatus) loadingSubStatus.textContent = subStatus;
    }

    // isBib=true の場合、白背景を足してアイテムを上部に配置するパディング処理。
    // ウェア（体に沿った着画）はそのまま、雑貨・帽子など平置きアイテムはこちらを使う。
    const processImage = (dataUri, isBib) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;

          const MAX_SIZE = 1024;
          if (w > MAX_SIZE || h > MAX_SIZE) {
            const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
            w = Math.floor(w * ratio);
            h = Math.floor(h * ratio);
          }

          if (!isBib) {
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          } else {
            const paddingRatio = 2.0;
            canvas.width = w * paddingRatio;
            canvas.height = h * paddingRatio;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const x = (canvas.width - w) / 2;
            const y = canvas.height * 0.25;
            ctx.drawImage(img, x, y, w, h);

            resolve(canvas.toDataURL('image/jpeg', 0.85));
          }
        };
        img.src = dataUri;
      });
    };

    generateBtn.addEventListener('click', async () => {
      // 登録順（ウェア→雑貨→帽子）でコーディネートのアイテム一覧を組み立てる。
      const items = [];
      if (slots.wear.dataUri) items.push({ dataUri: slots.wear.dataUri, type: 'clothes', label: 'ウェア' });
      if (slots.zakka.dataUri) items.push({ dataUri: slots.zakka.dataUri, type: 'bib', label: '雑貨' });
      if (slots.hat.dataUri) items.push({ dataUri: slots.hat.dataUri, type: 'hat', label: '帽子' });

      if (items.length === 0) {
        showError('ウェア・雑貨・帽子のいずれか1点以上を登録してください。');
        return;
      }

      const gender = document.querySelector('input[name="gender"]:checked').value;
      const race = document.querySelector('input[name="race"]:checked').value;
      const sLen = slots.wear.dataUri ? sleeveLength.value : '';
      const pLen = slots.wear.dataUri ? pantsLength.value : '';
      const pose = document.querySelector('input[name="pose"]:checked').value;

      generateBtn.disabled = true;
      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      hideError();
      updateProgress(0, "画像を最適化中...", "アイテムの種類に合わせて調整しています");

      try {
        const totalSteps = items.length;
        const stepSpan = 100 / (totalSteps + 0.5); // 最初のベビー生成分を少し多めに確保

        // --- 1点目：ベビーモデル生成 + 1点目の着せ込み ---
        const first = items[0];
        const firstProcessed = await processImage(first.dataUri, first.type !== 'clothes');

        updateProgress(5, "AIにリクエストを送信中...", "ベビーちゃんのモデル画像を生成しています");

        const startRes = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'start',
            garmentImageBase64: firstProcessed,
            gender,
            race,
            sleeveLength: sLen,
            pantsLength: pLen,
            itemType: first.type,
            pose
          })
        });

        if (!startRes.ok) {
          const errText = await startRes.text();
          console.error(`[${first.label}] start request failed:`, errText);
          if (startRes.status === 413 || errText.includes('Request Entity Too Large')) {
            throw new Error(`[${first.label}] 画像のデータサイズが大きすぎます。別の画像でお試しください。`);
          }
          throw new Error(`[${first.label}] 通信エラーが発生しました: ${errText}`);
        }

        const startData = await startRes.json();
        let currentImage = await waitForJob(
          startData.jobId,
          10,
          Math.round(stepSpan * 1.5),
          `${first.label}を合成中...`
        );

        // --- 2点目以降：直前の合成結果に重ねて着せる ---
        for (let i = 1; i < items.length; i++) {
          const item = items[i];
          const processed = await processImage(item.dataUri, true); // 雑貨・帽子は平置き扱い

          const progressStart = Math.round(stepSpan * (1.5 + (i - 1)));
          const progressEnd = Math.round(stepSpan * (1.5 + i));
          updateProgress(progressStart, `${item.label}を重ねています...`, "合成をリクエストしています");

          const nextRes = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'nextTryon',
              modelImageBase64: currentImage,
              garmentImageBase64: processed
            })
          });

          if (!nextRes.ok) {
            const errText = await nextRes.text();
            console.error(`[${item.label}] nextTryon request failed:`, errText);
            throw new Error(`[${item.label}] 通信エラーが発生しました: ${errText}`);
          }

          const nextData = await nextRes.json();
          currentImage = await waitForJob(nextData.jobId, progressStart, progressEnd, `${item.label}を合成中...`);
        }

        resultImage.src = currentImage;
        updateProgress(100, "完成しました！", "表示の準備をしています...");
        setTimeout(() => {
          loading.classList.add('hidden');
          resultContainer.classList.remove('hidden');
          generateBtn.disabled = false;
          resultContainer.scrollIntoView({ behavior: 'smooth' });
        }, 800);

      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
