<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ベビー着せ替えメーカー</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-indigo-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-extrabold text-indigo-900 mb-2">?? ベビー着せ替えメーカー</h1>
      <p class="text-sm text-gray-500">お持ちの洋服や甚平の画像をアップロードすると、赤ちゃんが着ているイメージ画像をAIが生成します。</p>
    </div>

    <div class="mb-5">
      <label class="block text-sm font-bold text-gray-700 mb-2">1. 画像ファイルを選択またはドラッグ＆ドロップ</label>
      <div id="dropZone" class="border-2 border-dashed border-indigo-300 rounded-xl p-6 text-center hover:bg-indigo-50 transition cursor-pointer flex flex-col items-center justify-center bg-gray-50">
        <svg class="w-10 h-10 text-indigo-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <p class="text-sm text-gray-600 font-medium mb-1">クリックして画像を選択するか、</p>
        <p class="text-xs text-gray-500">ここに画像をドラッグ＆ドロップ</p>
        <input type="file" id="imageInput" accept="image/*" class="hidden" />
      </div>
    </div>

    <div class="mb-5 flex justify-center">
      <img id="previewImage" class="hidden max-h-48 rounded-xl object-contain border-2 border-dashed border-gray-200">
    </div>

    <button id="generateBtn" disabled class="w-full bg-indigo-600 text-white font-bold py-3.5 px-4 rounded-xl hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg">
      ? 着用イメージを生成する
    </button>

    <div id="loading" class="hidden mt-6 text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-200 border-t-indigo-600"></div>
      <p class="mt-3 text-indigo-700 font-semibold text-sm">AIが一生懸命画像を生成しています...</p>
    </div>

    <div id="errorBox" class="hidden mt-5 p-4 bg-red-50 text-red-700 rounded-xl text-sm font-medium border border-red-100 text-center"></div>

    <div id="resultContainer" class="hidden mt-8 pt-6 border-t border-gray-100 text-center">
      <h2 class="text-lg font-bold text-gray-800 mb-4">?? 完成しました！</h2>
      <img id="resultImage" class="w-full rounded-2xl shadow-lg mx-auto">
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const previewImage = document.getElementById('previewImage');
    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('resultContainer');
    const resultImage = document.getElementById('resultImage');
    const errorBox = document.getElementById('errorBox');

    let currentBase64 = null;
    let currentMimeType = null;

    const handleFile = (file) => {
      if (!file || !file.type.startsWith('image/')) {
        previewImage.classList.add('hidden');
        currentBase64 = null;
        generateBtn.disabled = true;
        return;
      }
      currentMimeType = file.type;
      const reader = new FileReader();
      reader.onload = (event) => {
        const dataUrl = event.target.result;
        previewImage.src = dataUrl;
        previewImage.classList.remove('hidden');
        currentBase64 = dataUrl.split(',')[1];
        generateBtn.disabled = false;
        resultContainer.classList.add('hidden');
        errorBox.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    };

    imageInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    dropZone.addEventListener('click', () => imageInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-indigo-100'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('bg-indigo-100'); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('bg-indigo-100');
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    generateBtn.addEventListener('click', async () => {
      if (!currentBase64) return;
      
      generateBtn.disabled = true;
      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      errorBox.classList.add('hidden');

      try {
        // ★ ここが重要！外部のAIではなく、自分が作ったVercelのサーバーを呼び出す
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imageBase64: currentBase64,
            mimeType: currentMimeType
          })
        });

        const data = await response.json();
        
        if (!response.ok) throw new Error(data.error || '通信エラー');

        const parts = data.candidates?.[0]?.content?.parts;
        const imagePart = parts?.find(p => p.inlineData);
        
        if (imagePart?.inlineData?.data) {
          resultImage.src = `data:${imagePart.inlineData.mimeType || 'image/jpeg'};base64,${imagePart.inlineData.data}`;
          resultContainer.classList.remove('hidden');
        } else {
          throw new Error('画像の生成に失敗しました。');
        }
      } catch (error) {
        errorBox.textContent = "エラーが発生しました。時間をおいてお試しください。";
        errorBox.classList.remove('hidden');
      } finally {
        generateBtn.disabled = false;
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
