<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ベビー着画メーカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .radio-group label {
      @apply border-2 border-gray-200 rounded-xl px-4 py-3 text-center cursor-pointer transition text-sm font-medium text-gray-700 bg-white hover:bg-gray-50;
    }
    .radio-group input[type="radio"]:checked + label {
      @apply border-indigo-500 bg-indigo-50 text-indigo-700 font-bold;
    }
    .disabled-section {
      @apply opacity-40 pointer-events-none transition;
    }
  </style>
</head>
<body class="bg-indigo-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-lg my-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold text-indigo-900 mb-2">&#x1f476; ベビー着画メーカー</h1>
      <p class="text-sm text-gray-500">置き画からベビー着画を生成します</p>
    </div>

    <!-- 1. 服の画像アップロード -->
    <div class="mb-8">
      <label class="block text-sm font-bold text-gray-800 mb-2">&#x2460; 着せたいアイテムの画像をアップロード</label>

      <!--
      <div class="bg-yellow-50 border-l-4 border-yellow-400 p-3 mb-3 text-xs text-yellow-800 rounded-r-lg">
        <strong>💡 色を正確に再現するコツ:</strong><br>
        複数の服が写っているとAIの処理で色が混ざってしまいます。<strong>「着せたい服が1着だけ写るようにトリミング（切り抜き）」</strong>した画像をお使いください。
      </div>
      -->
      <div id="dropZone" class="border-2 border-dashed border-indigo-300 rounded-2xl p-8 text-center hover:bg-indigo-50 transition cursor-pointer flex flex-col items-center justify-center bg-gray-50 group">
        <div class="bg-white p-3 rounded-full shadow-sm mb-4 group-hover:scale-110 transition">
          <svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <p class="text-sm text-gray-600 font-medium">クリックして画像を選択</p>
        <p class="text-xs text-gray-400 mt-1">またはドラッグ＆ドロップ</p>
        <input type="file" id="imageInput" accept="image/*" class="hidden" />
      </div>
      <div class="mt-4 flex justify-center">
        <img id="previewGarment" class="hidden h-40 rounded-xl object-contain border-2 border-gray-100 shadow-sm" alt="アイテムのプレビュー">
      </div>
    </div>

    <!-- アイテムの種類 -->
    <div class="mb-6">
      <label class="block text-sm font-bold text-gray-800 mb-3">&#x2461; アイテムの種類</label>
      <div class="flex gap-3 radio-group">
        <div class="flex-1">
          <input type="radio" name="itemType" value="clothes" id="typeClothes" class="sr-only" checked>
          <label for="typeClothes" class="block w-full">&#x1F455; ウェア</label>
        </div>
        <div class="flex-1">
          <input type="radio" name="itemType" value="bib" id="typeBib" class="sr-only">
          <label for="typeBib" class="block w-full">&#x1f3a9; 雑貨（スタイなど）</label>
        </div>
      </div>
    </div>

    <!-- 服の詳細指定 -->
    <div id="clothesDetailSection" class="mb-8">
      <label class="block text-sm font-bold text-gray-800 mb-3">&#x2462; 丈感</label>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-600 mb-1">袖の長さ</label>
          <select id="sleeveLength" class="w-full rounded-xl border-2 border-gray-200 p-3 text-sm focus:border-indigo-500 focus:outline-none transition">
            <option value="">指定なし</option>
            <option value="sleeveless">ノースリーブ</option>
            <option value="short sleeves" selected>半袖</option>
            <option value="long sleeves">長袖</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">パンツの長さ</label>
          <select id="pantsLength" class="w-full rounded-xl border-2 border-gray-200 p-3 text-sm focus:border-indigo-500 focus:outline-none transition">
            <option value="">指定なし</option>
            <option value="short pants">半ズボン・短パン</option>
            <option value="long pants">長ズボン</option>
            <option value="no pants" selected>ズボンなし（足開き）</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 赤ちゃんの特徴選択 -->
    <div class="mb-8">
      <label class="block text-sm font-bold text-gray-800 mb-3">&#x2463; ベビーモデル選択</label>
      
      <div class="mb-4">
        <p class="text-xs text-gray-600 font-bold mb-2 ml-1">性別</p>
        <div class="flex gap-3 radio-group">
          <div class="flex-1">
            <input type="radio" name="gender" value="baby boy" id="boy" class="sr-only" checked>
            <label for="boy" class="block w-full">&#x1F466; 男の子</label>
          </div>
          <div class="flex-1">
            <input type="radio" name="gender" value="baby girl" id="girl" class="sr-only">
            <label for="girl" class="block w-full">&#x1F467; 女の子</label>
          </div>
        </div>
      </div>

      <div>
        <p class="text-xs text-gray-600 font-bold mb-2 ml-1">タイプ</p>
        <div class="grid grid-cols-3 gap-3 radio-group">
          <div>
            <input type="radio" name="race" value="Japanese" id="jp" class="sr-only" checked>
            <label for="jp" class="block w-full">日本人</label>
          </div>
          <div>
            <input type="radio" name="race" value="half-Caucasian, half-Japanese" id="half" class="sr-only">
            <label for="half" class="block w-full">ハーフ系</label>
          </div>
          <div>
            <input type="radio" name="race" value="Caucasian" id="ca" class="sr-only">
            <label for="ca" class="block w-full">欧米系</label>
          </div>
        </div>
      </div>
    </div>

    <button id="generateBtn" disabled class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 px-4 rounded-2xl hover:from-indigo-700 hover:to-purple-700 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
      &#x2728; モデルと着画を生成する
    </button>

    <!-- ローディング表示 -->
    <div id="loading" class="hidden mt-8 text-center bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
      <div class="relative w-16 h-16 mx-auto mb-4">
        <div class="absolute inset-0 border-4 border-indigo-200 rounded-full animate-ping opacity-25"></div>
        <div class="absolute inset-0 border-4 border-t-indigo-600 rounded-full animate-spin"></div>
      </div>
      <p id="loadingStatus" class="text-indigo-800 font-bold text-lg animate-pulse">AIが準備しています...</p>
      <p id="loadingSubStatus" class="text-sm text-indigo-600 mt-2">しばらくお待ちください</p>
      
      <!-- 進捗バー -->
      <div class="w-full bg-gray-200 rounded-full h-3 mt-6 overflow-hidden relative">
        <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full w-0 transition-all duration-700 ease-out"></div>
      </div>
    </div>

    <!-- エラー表示 -->
    <div id="errorBox" class="hidden mt-6 p-5 bg-red-50 text-red-700 rounded-2xl text-sm font-medium border border-red-200 text-center shadow-sm flex items-center justify-center gap-2">
      <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span id="errorMessage"></span>
    </div>

    <!-- 結果表示 -->
    <div id="resultContainer" class="hidden mt-10 text-center">
      <h2 class="text-xl font-extrabold text-gray-800 mb-6 flex items-center justify-center gap-2">
        <span class="text-2xl">&#x1F389;</span> 完成しました！
      </h2>
      
      <!-- ユーザーの安心感向上のためのプライバシーメッセージ
      <p class="text-xs text-gray-500 mb-4 bg-gray-50 p-2 rounded-lg border border-gray-100">
        &#x1F512; この画像はAIサーバーから安全に削除されました。<br>保存する場合は下のボタンを押してください。
      </p>
　　　-->
      
      <div class="bg-white p-2 rounded-3xl shadow-lg border-2 border-indigo-50 inline-block">
        <img id="resultImage" class="w-full max-w-md rounded-2xl" alt="生成された画像">
      </div>
      
      <button id="downloadBtn" class="mt-6 w-full sm:w-auto bg-green-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-green-600 transition shadow-md flex items-center justify-center gap-2 mx-auto">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        画像を保存する
      </button>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const previewGarment = document.getElementById('previewGarment');
    const generateBtn = document.getElementById('generateBtn');
    
    const loading = document.getElementById('loading');
    const loadingStatus = document.getElementById('loadingStatus');
    const loadingSubStatus = document.getElementById('loadingSubStatus');
    const progressBar = document.getElementById('progressBar');
    
    const resultContainer = document.getElementById('resultContainer');
    const resultImage = document.getElementById('resultImage');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const downloadBtn = document.getElementById('downloadBtn');

    const sleeveLength = document.getElementById('sleeveLength');
    const pantsLength = document.getElementById('pantsLength');
    const clothesDetailSection = document.getElementById('clothesDetailSection');

    let currentDataUri = null;

    const radioButtons = document.querySelectorAll('input[name="itemType"]');
    radioButtons.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'bib') {
          clothesDetailSection.classList.add('disabled-section');
        } else {
          clothesDetailSection.classList.remove('disabled-section');
        }
      });
    });

    const handleFile = (file) => {
      if (!file || !file.type.startsWith('image/')) {
        showError("画像ファイルを選択してください。");
        return;
      }
      const reader = new FileReader();
      reader.onload = (event) => {
        currentDataUri = event.target.result;
        previewGarment.src = currentDataUri;
        previewGarment.classList.remove('hidden');
        generateBtn.disabled = false;
        hideError();
        resultContainer.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    };

    imageInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    dropZone.addEventListener('click', () => imageInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500', 'bg-indigo-50'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('border-indigo-500', 'bg-indigo-50'); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    downloadBtn.addEventListener('click', () => {
      if (!resultImage.src) return;
      const a = document.createElement('a');
      a.href = resultImage.src;
      a.download = `baby_kisekae_${new Date().getTime()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    const checkStatus = async (jobId) => {
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'status', jobId })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'ステータス確認に失敗しました');

        if (data.status === 'completed') {
          resultImage.src = data.output[0];
          
          // 画像表示直後にFashn.aiのサーバーから履歴を削除
          fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'delete', jobId: jobId })
          }).catch(e => console.error("削除リクエストエラー", e));

          updateProgress(100, "完成しました！", "表示の準備をしています...");
          setTimeout(() => {
            loading.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            generateBtn.disabled = false;
            resultContainer.scrollIntoView({ behavior: 'smooth' });
          }, 1000);
          
        } else if (data.status === 'failed') {
          throw new Error(data.error?.message || 'AI側で合成に失敗しました。別の画像でお試しください。');
        } else {
          updateProgress(
            Math.min(parseInt(progressBar.style.width) + 15, 90),
            "がんばって合成しています...",
            "高精度な処理のため、もう少しかかります"
          );
          setTimeout(() => checkStatus(jobId), 4000);
        }
      } catch (err) {
        showError(err.message);
      }
    };

    const showError = (msg) => {
      errorMessage.textContent = msg;
      errorBox.classList.remove('hidden');
      loading.classList.add('hidden');
      generateBtn.disabled = false;
    }
    const hideError = () => {
      errorBox.classList.add('hidden');
    }

    const updateProgress = (percent, status, subStatus) => {
      progressBar.style.width = `${percent}%`;
      loadingStatus.textContent = status;
      if (subStatus) loadingSubStatus.textContent = subStatus;
    }

    const processImage = (dataUri, isBib) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;

          // Vercelの制限(4.5MB)を確実にクリアするためのバランス調整
          const MAX_SIZE = 1500;
          if (w > MAX_SIZE || h > MAX_SIZE) {
            const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
            w = Math.floor(w * ratio);
            h = Math.floor(h * ratio);
          }

          if (!isBib) {
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.92));
          } else {
            const paddingRatio = 2.0; 
            canvas.width = w * paddingRatio;
            canvas.height = h * paddingRatio;
            const ctx = canvas.getContext('2d');
            
            // データが重くなる透過PNGをやめ、白背景のJPEGにする
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const x = (canvas.width - w) / 2;
            const y = canvas.height * 0.25; 
            ctx.drawImage(img, x, y, w, h);
            
            resolve(canvas.toDataURL('image/jpeg', 0.90));
          }
        };
        img.src = dataUri;
      });
    };

    generateBtn.addEventListener('click', async () => {
      if (!currentDataUri) return;
      
      const gender = document.querySelector('input[name="gender"]:checked').value;
      const race = document.querySelector('input[name="race"]:checked').value;
      const sLen = sleeveLength.value;
      const pLen = pantsLength.value;
      const itemType = document.querySelector('input[name="itemType"]:checked').value;

      generateBtn.disabled = true;
      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      hideError();
      
      updateProgress(10, "画像を最適化中...", "アイテムの種類に合わせて調整しています");

      try {
        // ここで画像のリサイズと余白調整を実行
        const processedImageBase64 = await processImage(currentDataUri, itemType === 'bib');

        updateProgress(20, "AIにリクエストを送信中...", "ベビーちゃんのモデル画像を生成しています");

        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'start',
            garmentImageBase64: processedImageBase64,
            gender: gender,
            race: race,
            sleeveLength: sLen,
            pantsLength: pLen,
            itemType: itemType
          })
        });
        
        // 追加: JSON変換前に通信自体のエラーを検知する
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`通信エラーが発生しました: ${errText}`);
        }
        
        const data = await res.json();

        const jobId = data.jobId;
        updateProgress(50, "モデルの生成が完了しました", "アイテムの合成を開始します...");

        setTimeout(() => checkStatus(jobId), 4000);

      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
