<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高精度ベビー着せ替えメーカー (Fashn.ai版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    /* カスタムラジオボタンのスタイル */
    input[type="radio"]:checked + div { border-color: #4f46e5; background-color: #eef2ff; }
    input[type="radio"]:checked + div .check-icon { display: block; }
  </style>
</head>
<body class="bg-indigo-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-lg my-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-extrabold text-indigo-900 mb-2">&#x1F458; 高精度ベビー着せ替えメーカー</h1>
      <p class="text-sm text-gray-500">お持ちの洋服の画像をアップロードすると、ロゴや柄を維持したままモデルに着せ替えます。</p>
    </div>

    <!-- 1. 服の画像アップロード -->
    <div class="mb-6">
      <label class="block text-sm font-bold text-gray-700 mb-2">1. 着せたい服の画像をアップロード</label>
      <div id="dropZone" class="border-2 border-dashed border-indigo-300 rounded-xl p-6 text-center hover:bg-indigo-50 transition cursor-pointer flex flex-col items-center justify-center bg-gray-50">
        <svg class="w-10 h-10 text-indigo-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <p class="text-sm text-gray-600 font-medium mb-1">クリックして服の画像を選択</p>
        <input type="file" id="imageInput" accept="image/*" class="hidden" />
      </div>
      <div class="mt-3 flex justify-center">
        <img id="previewGarment" class="hidden max-h-32 rounded-xl object-contain border border-gray-200" alt="服のプレビュー">
      </div>
    </div>

    <!-- 2. 服のカテゴリ -->
    <div class="mb-6">
      <label class="block text-sm font-bold text-gray-700 mb-2">2. 服のカテゴリを選択</label>
      <select id="garmentCategory" class="w-full rounded-xl border-2 border-gray-200 p-3 text-sm focus:border-indigo-500 focus:outline-none">
        <option value="one-pieces">ロンパース・ワンピース (One-pieces)</option>
        <option value="tops">トップス (Tops)</option>
        <option value="bottoms">ボトムス (Bottoms)</option>
      </select>
    </div>

    <!-- 3. モデルの選択 -->
    <div class="mb-6">
      <label class="block text-sm font-bold text-gray-700 mb-2">3. 赤ちゃんのモデルを選択</label>
      <div class="grid grid-cols-2 gap-3">
        <!-- モデル1 -->
        <label class="cursor-pointer relative">
          <input type="radio" name="modelImage" value="https://images.unsplash.com/photo-1519689680058-324335c77eba?w=600&auto=format&fit=crop&q=80" class="sr-only" checked>
          <div class="border-2 border-gray-200 rounded-xl overflow-hidden hover:bg-gray-50 transition relative">
            <img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?w=300&auto=format&fit=crop&q=80" class="w-full h-32 object-cover" alt="モデル1">
            <div class="p-2 text-center text-xs font-bold text-gray-700 bg-white">モデル A</div>
            <div class="check-icon hidden absolute top-2 right-2 bg-indigo-600 text-white rounded-full p-1 shadow">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
          </div>
        </label>
        <!-- モデル2 -->
        <label class="cursor-pointer relative">
          <input type="radio" name="modelImage" value="https://images.unsplash.com/photo-1544098485-2a2ed6da40ba?w=600&auto=format&fit=crop&q=80" class="sr-only">
          <div class="border-2 border-gray-200 rounded-xl overflow-hidden hover:bg-gray-50 transition relative">
            <img src="https://images.unsplash.com/photo-1544098485-2a2ed6da40ba?w=300&auto=format&fit=crop&q=80" class="w-full h-32 object-cover" alt="モデル2">
            <div class="p-2 text-center text-xs font-bold text-gray-700 bg-white">モデル B</div>
            <div class="check-icon hidden absolute top-2 right-2 bg-indigo-600 text-white rounded-full p-1 shadow">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
          </div>
        </label>
      </div>
    </div>

    <button id="generateBtn" disabled class="w-full bg-indigo-600 text-white font-bold py-3.5 px-4 rounded-xl hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
      &#x2728; 高精度・着せ替えを開始する
    </button>

    <!-- ローディング表示 -->
    <div id="loading" class="hidden mt-6 text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-200 border-t-indigo-600 mb-2"></div>
      <p id="loadingStatus" class="text-indigo-700 font-bold text-sm">AIに画像生成をリクエスト中...</p>
      <p class="text-xs text-gray-500 mt-1">※高精度な処理のため、30秒〜1分ほどかかる場合があります。</p>
      
      <!-- 進捗バー -->
      <div class="w-full bg-gray-200 rounded-full h-2.5 mt-4 overflow-hidden">
        <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full w-10 transition-all duration-1000"></div>
      </div>
    </div>

    <!-- エラー表示 -->
    <div id="errorBox" class="hidden mt-5 p-4 bg-red-50 text-red-700 rounded-xl text-sm font-medium border border-red-100 text-center"></div>

    <!-- 結果表示 -->
    <div id="resultContainer" class="hidden mt-8 pt-6 border-t border-gray-100 text-center">
      <h2 class="text-lg font-bold text-gray-800 mb-4">&#x1F389; 着せ替えが完了しました！</h2>
      <img id="resultImage" class="w-full rounded-2xl shadow-lg mx-auto mb-5" alt="生成された画像">
      
      <button id="downloadBtn" class="w-full bg-green-600 text-white font-bold py-3.5 px-4 rounded-xl hover:bg-green-700 transition shadow-md flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        画像を保存する
      </button>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const previewGarment = document.getElementById('previewGarment');
    const generateBtn = document.getElementById('generateBtn');
    const garmentCategory = document.getElementById('garmentCategory');
    
    const loading = document.getElementById('loading');
    const loadingStatus = document.getElementById('loadingStatus');
    const progressBar = document.getElementById('progressBar');
    
    const resultContainer = document.getElementById('resultContainer');
    const resultImage = document.getElementById('resultImage');
    const errorBox = document.getElementById('errorBox');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentDataUri = null;

    // 画像ファイルの読み込み
    const handleFile = (file) => {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        currentDataUri = event.target.result; // data:image/jpeg;base64,... の形式
        previewGarment.src = currentDataUri;
        previewGarment.classList.remove('hidden');
        generateBtn.disabled = false;
        resultContainer.classList.add('hidden');
        errorBox.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    };

    imageInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    dropZone.addEventListener('click', () => imageInput.click());

    // ダウンロード機能
    downloadBtn.addEventListener('click', () => {
      if (!resultImage.src) return;
      const a = document.createElement('a');
      a.href = resultImage.src;
      a.download = `vton_${new Date().getTime()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // ポーリング関数（数秒おきにステータスを確認）
    const checkStatus = async (jobId) => {
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'status', jobId })
        });
        const data = await res.json();

        if (data.status === 'completed') {
          resultImage.src = data.output[0];
          loading.classList.add('hidden');
          resultContainer.classList.remove('hidden');
          generateBtn.disabled = false;
        } else if (data.status === 'failed') {
          throw new Error('AI側で画像の合成に失敗しました。別の服の画像でお試しください。');
        } else {
          loadingStatus.textContent = "AIが洋服の合成計算を行っています...";
          let currentWidth = parseInt(progressBar.style.width || '10');
          if(currentWidth < 90) progressBar.style.width = `${currentWidth + 10}%`;
          setTimeout(() => checkStatus(jobId), 3000);
        }
      } catch (err) {
        showError(err.message);
      }
    };

    const showError = (msg) => {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
      loading.classList.add('hidden');
      generateBtn.disabled = false;
    }

    // 生成ボタンのクリック処理
    generateBtn.addEventListener('click', async () => {
      if (!currentDataUri) return;
      
      const selectedModel = document.querySelector('input[name="modelImage"]:checked').value;

      generateBtn.disabled = true;
      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      errorBox.classList.add('hidden');
      progressBar.style.width = '10%';
      loadingStatus.textContent = "AIに画像生成をリクエスト中...";

      try {
        // ステップ1: ジョブの開始
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'start',
            modelImage: selectedModel,
            garmentImageBase64: currentDataUri
          })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '通信エラーが発生しました');

        const jobId = data.jobId;
        progressBar.style.width = '20%';
        loadingStatus.textContent = "ジョブが登録されました。待機中...";

        // ステップ2: 完了するまで数秒おきに確認開始
        setTimeout(() => checkStatus(jobId), 3000);

      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
